#
# [0000]
# Type=6						병사는 6
# SubType=0						0=방패병, 1=기관총병, 2=도검병, 3=투척병, 4=바추카병, 5=굴림병
# WeaponId=112					공격 무기 id : weapon-XX.ini 참고
# SightRange=700				시야 거리 : 이 거리에 플레이어가 들어오면 타겟으로 삼고 쫓아간다.
# AttackRange=500				공격 거리 : 이 거리안에 타겟된 플레이어가 들어오면 공격한다
# MoveRange=500					배회시 이동 거리 : 태어난 곳의 X 좌표를 기준으로 -R ~ +R
# Hp=20							체력
# MoveSpeed=3.0					한틱에 걸어갈 거리
# MoveAnimationRatio=1.0		걷기 애니메이션의 플레이 비율
# ActionDelay=100				각 동작간 딜레이 (걷기와 걷기 중간은 딜레이 없음)
# LifeTime=60					몹의 생명 시간 : 미구현 !!!
#

