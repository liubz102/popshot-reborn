## 범용주석
# 본 ini파일은 각 공격의 패턴을 설정하는데 필요한 정보를 담고 있음.
# HP, 모션의 길이, 시간개념, 탄환수, 발사횟수등 "대미지"를 제외한 나머지 요소를 다룸.
# 대미지 관련 정보는 Weapon-boss01-x.ini 파일에서 다룸.
# 거리 = 픽셀(pixel)
# 틱 = 1/33 초
################################################## 크기 및 HP설정 #################################
[General]
# 몸통 크기 비율
SizeRatio=1.3
# 주의 : x방향90%, y방향90% 라면 면적은 81% 가 된다
# 면적대비 90% 라면 0.94 정도로 입력해야
PartHeadHp=500
PartHelmetHp=200
PartChestHp=200
PartGuardHp=240
# PartHeadHp=600
# PartHelmetHp=216
# PartChestHp=240
# PartGuardHp=300
# 충돌 데미지
MeleeDamage=20
# 자동 Turn 하는, 화면 양쪽 끝 범위
AutoTurnPixel=350

# 화면밖 점프 범위
OutScreenRange=100

# phase2의 몸통일때 강제 데미지 값
BodyDamage=1
# 스위치 켜지고 꺼졌을때 데미지 비율
SwitchOnRatio=2.8
SwitchOffRatio=0.4
# 스위치로 데미지 강하게 입히는 총량
SwitchAmount=300
# 스위치 크기
SwitchSize=30

