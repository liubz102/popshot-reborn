CreateTick=23
DeleteTick=43
Size=10
Damage=10
ProofTick=100
TurnRange=100
# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
Shake=36,36,10,100,8,500,1
##################################################### 뒤돌기 ######################################
[Turn]
LeftAnimation=Turn_Left,0.8
RightAnimation=Turn_Right,0.8
# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
Shake=99,99,10,100,8,300,1
##################################################### 총알 ########################################
