# 각 물결간 거리 간격
DistInterval=40
# 물결 갯수
Column=6
# 데미지 : 파워 웨이브는 weapon-bossXX-X.ini 에 들어가지 않고 별도 처리
Damage=20
# 최소 물결 크기
MinSize=20
# 최대 물결 크기
MaxSize=150
# 물결 단위 높이
UnitHeight=30
# 연달아 맞지 않는 간격
ProofTick=20
# 표면에 닿았을때의 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간ms, 진폭, 유지시간ms, 방향(0=좌우,1=상하)
Shake=5,5,1,100,6,500,0
# 예를 들어
# 물결 갯수 = 5, 최소 = 10, 최대 = 90, 단위 높이 = 30 이면... 각 높이는 10, 50, 90, 50, 10 이 된다
# 각각의 높이는 단위 갯수에 따라 객체가 쌓이니까 = 올림(각높이/단위높이) ... 갯수로는 1, 2, 3, 2, 1 개가 된다.
