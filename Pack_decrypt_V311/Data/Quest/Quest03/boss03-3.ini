## 범용주석
# 본 ini파일은 각 공격의 패턴을 설정하는데 필요한 정보를 담고 있음.
# HP, 모션의 길이, 시간개념, 탄환수, 발사횟수등 "대미지"를 제외한 나머지 요소를 다룸.
# 대미지 관련 정보는 Weapon-boss01-x.ini 파일에서 다룸.
#
# 거리 = 픽셀(pixel)
# 틱 = 1/33 초

################################################## 크기 및 HP설정 ###########################################################################
# 탱크 몸통 크기 비율
SizeRatio=0.95
# 주의 : x방향90%, y방향90% 라면 면적은 81% 가 된다
# 면적대비 90% 라면 0.94 정도로 입력해야

BodyHp=1200
WheelHp=100
MachinGunHp=200
Cannon1Hp=200
Cannon2Hp=200

## 충돌 데미지
BodyMeleeDamage=32
TurretMeleeDamage=30
WheelMeleeDamage=30
MachineGunMeleeDamage=30
Cannon1MeleeDamage=30
Cannon2MeleeDamage=30
######################################################################################################################################################


################################################### MachineGun : 기관총 #######################################################################################
[MachineGun]
# 모션 설정
Animation=Fire_MachineGun,0.5

# 발사 시작 틱
TickStart=0

# 한번 발사시 총알 갯수
AngleCount=1

# 탄간 각 거리
AngleInterval=15

# 최소 각 제한
MinAngle=60
######################################################################################################################################################


################################################### MachineGun2 : 기관총2 #####################################################################################
[MachineGun2]
# 모션 설정
Animation=Fire_MachineGun,0.5

# 발사 시작 틱
TickStart=0

# 한번 발사시 총알 갯수
AngleCount=1

# 탄간 각 거리
AngleInterval=15

# 최소 각 제한
MinAngle=60
######################################################################################################################################################


###################################################### 전면 Cannon : Nuke 발사 ###################################################### ################################################### 
[Cannon1]
# 메인 모션 설정
Animation=Fire_Cannon1

# 시작 틱
TickStart=1

# 발사 반복 수
AttackCount=3

# 반복간 대기 틱
TickInterval=10

# 핵탄의 발사 속도
VelMin=1.0
VelMax=3.0

# 핵탄의 발사 각도 : 180 + @, 360 - @
VelAngle=-10
VelAngle=10
##############################################################################################################################


##################################################### 상단 Launcher : 스카이 락 ##############################################################################
[Cannon2]
# 모션 설정
Animation=Fire_Cannon2

# 발사 시작 틱
TickStart=1

# 발사 반복 수
AttackCount=1

# 반복간 대기 틱
TickInterval=5

# 반복간 거리
DistInterval=40

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
Shake=36,36,10,100,8,1500,1
######################################################################################################################################################


##################################################### 이동 #############################################################################
[Move]
# 모션 설정
LeftAnimation=Move_Left,1.0,2000,cycle
RightAnimation=Move_Right,1.0,2000,cycle
StopAnimation=Idle

# 한 틱 당 움직이는 거리
DistInterval=10

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
Shake=36,36,10,100,8,1500,1
######################################################################################################################################################


##################################################### 이동2 #############################################################################
[Move2]
# 모션 설정
LeftAnimation=Move_Left,1.5,2000,cycle
RightAnimation=Move_Right,1.5,2000,cycle
StopAnimation=Idle

# 한 틱 당 움직이는 거리
DistInterval=25

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
Shake=36,36,10,100,8,1500,1
######################################################################################################################################################



##################################################### 상단 회전 #############################################################################
[Turn]
# 모션 설정
Animation=Turn_Right

# 이동 시간 틱
TurnTick=60
######################################################################################################################################################


##################################################### 휴식 #############################################################################
[Idle]
# 모션 설정
Animation1=Idle,1.5
Animation2=Idle
######################################################################################################################################################


##################################################### 사망 #############################################################################
[Death]
# 모션 설정
Animation=dead

# 연출 간격 틱
# EffectInterval=16

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
DeathShake=24,24,1,200,12,5000,1
########################################################################################################################################


##################################################### 출현 #############################################################################
[Birth]
# 모션 설정
Animation=Birth

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
BirthShake=24, 24,1,100,5,3200,1
########################################################################################################################################


################################################## 각 단계별 공격패턴 정의 ####################################################################################################

# 1. 모션중에는 시작/메인/끝 모션이 다른게 있고 합쳐진게 있는데
#    완벽한 조정을 하려면 쪼개 놓는 쪽이 편하겠지..
#
# 2. ini로 뽑아내지 않은 항목은 클랴에게 문의 바람


### 각 단계별 공격 패턴 정의 ###

# type=종류
#    order 순서대로 1~
#    random 확률로 (0 이상 값)

### 기술 이름 ###
# idle1
# idle2
# move
# move2
# machinegun
# machinegun2
# cannon1
# cannon2

######################################################################################################################################################

################################################## 페이즈 설정 ###########################################################################
[phase1]
type=order

1=idle2
2=cannon1
3=machinegun,3
4=cannon1,2
5=idle2
6=move
7=move2
8=cannon2
9=machinegun,2
10=move2,2

######################################################################################################################################################
