# 발사 횟수 : 위 아래 번갈아 발사됨
HomingAttackCount=1

# 반복간 대기 틱 : 주의 !) 횟수*틱 이 모션시간 보다 크면 발사되지 않는게 생김
HomingTickInterval=15

# 발사 시작 틱
HomingTickStart=4

# 한번 발사시 총알 갯수
HomingAngleCount=3

# 발사간 각도
HomingAngleInterval=5

########################################################################################################################################





