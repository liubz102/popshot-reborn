## 범용주석
# 본 ini파일은 각 공격의 패턴을 설정하는데 필요한 정보를 담고 있음.
# HP, 모션의 길이, 시간개념, 탄환수, 발사횟수등 "대미지"를 제외한 나머지 요소를 다룸.
# 대미지 관련 정보는 Weapon-boss01-x.ini 파일에서 다룸.


# 거리 = 픽셀(pixel)
# 틱 = 1/33 초

################################################## 크기 및 HP설정 ###########################################################################

## 용가리 몸통 크기 비율
SizeRatio=0.8
# 주의 : x방향90%, y방향90% 라면 면적은 81% 가 된다
# 면적대비 90% 라면 0.94 정도로 입력해야

# 1단계
PartHeadShellHp=180
PartBody1ShellHp=80
PartBody2ShellHp=150
PartBody3ShellHp=150

# 2단계(대가리는 맨 마지막에 파괴할 수 있음)
PartHeadHp=350
PartBody1Hp=150
PartBody2Hp=250
PartBody3Hp=250


## 충돌 데미지
BossMeleeDamage0=30
BossMeleeDamage1=30
BossMeleeDamage2=30
BossMeleeDamage3=30
BossMeleeDamage4=30


######################################################################################################################################################


################################################### 직사 #######################################################################################
# 시작/메인/끝 모션 설정
JiksaStartAnimation=Jiksa_Ready
JiksaAnimation=Jiksa_Fire,0.5,1300,cycle
JiksaEndAnimation=Jiksa_End

# 발사 시작 틱
JiksaTickStart=3

# 한번 발사시 총알 갯수
JiksaAngleCount=3

# 발사 반복 횟수
JiksaAttackCount=2

# 반복 발사 간 딜레이 틱
JiksaTickInterval=25

# 탄간 각 거리
JiksaAngleInterval=15

# 최소 각 제한
JiksaMinAngle=60
######################################################################################################################################################



################################################### 직사2 #######################################################################################
# 시작/메인/끝 모션 설정
Jiksa2StartAnimation=Jiksa_Ready
Jiksa2Animation=Jiksa_Fire,0.5,1300,cycle
Jiksa2EndAnimation=Jiksa_End

# 발사 시작 틱
Jiksa2TickStart=3

# 한번 발사시 총알 갯수
Jiksa2AngleCount=3

# 발사 반복 횟수
Jiksa2AttackCount=2

# 반복 발사 간 딜레이 틱
Jiksa2TickInterval=25

# 탄간 각 거리
Jiksa2AngleInterval=15

# 최소 각 제한
Jiksa2MinAngle=60
######################################################################################################################################################



#################################################### ## 파워 웨이브 ###################################################### ################################################### 
# 시작/메인/끝 모션 설정 : Idle 모션을 1.0의 속도로 2초간
PowerWaveStartAnimation=Power_Ready
PowerWaveAnimation=Power_Fire
PowerWaveEndAnimation=Power_End

# 발사 시작 틱
PowerWaveTickStart=3

# 각 물결간 시간 간격 틱
PowerWaveTickInterval=6

# 각 물결간 거리 간격
PowerWaveDistInterval=80

# 물결 갯수
PowerWaveColumn=5

# 데미지 : 파워 웨이브는 weapon-bossXX-X.ini 에 들어가지 않고 별도 처리
PowerWaveDamage=20

# 바닥 높이
PowerWaveBase=80

# 최소 물결 크기
PowerWaveMinSize=40

# 최대 물결 크기
PowerWaveMaxSize=120

# 물결 단위 높이
PowerWaveUnitHeight=40

# 연달아 맞지 않는 간격
PowerWaveProofTick=10

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간ms, 진폭, 유지시간ms, 방향(0=좌우,1=상하)
PowerWaveHeadShake=5,5,1,100,6,500,0
#PowerWaveMoveShake=5,10,6,50,4,50,1

# 예를 들어
# 물결 갯수 = 5, 최소 = 10, 최대 = 90, 단위 높이 = 30 이면... 각 높이는 10, 50, 90, 50, 10 이 된다
# 각각의 높이는 단위 갯수에 따라 객체가 쌓이니까 = 올림(각높이/단위높이) ... 갯수로는 1, 2, 3, 2, 1 개가 된다.
##############################################################################################################################




################################################### 헬 브레스 ##################################################################
# 메인 모션 설정
HellBreathAnimation=Breath,0.8

# 발사 시작 틱
HellBreathTickStart=50

# 각 불덩어리 간격 틱 : weapon...ini 화일의 헬 브레스 속도, 이펙의 유지 시간과 밀접한 관계
HellBreathTickInterval=2

# 시각/끝 각도 : 3시=0도, 6시=90도, 9시=180도, 12시=270도
HellBreathAngleStart=60
HellBreathAngleEnd=140

# 각 불덩어리 간 각도
HellBreathAngleInterval=2

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
HellBreathShake=80,135,2,100,4,100,1
##############################################################################################################################




##################################################### 호밍 ##############################################################################
# 시작/메인/끝 모션 설정
