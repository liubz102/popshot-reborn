범용주석
# 본 ini파일은 각 공격의 패턴을 설정하는데 필요한 정보를 담고 있음.
# HP, 모션의 길이, 시간개념, 탄환수, 발사횟수등 "대미지"를 제외한 나머지 요소를 다룸.
# 대미지 관련 정보는 Weapon-boss01-x.ini 파일에서 다룸.

################################################## 크기 및 HP설정 ###########################################################################

# 거리 = 픽셀(pixel)
# 틱 = 1/33 초

## 용가리 몸통 크기 비율
SizeRatio=0.8
# 주의 : x방향90%, y방향90% 라면 면적은 81% 가 된다
# 면적대비 90% 라면 0.94 정도로 입력해야

# 1단계
PartHeadShellHp=270
PartBody1ShellHp=120
PartBody2ShellHp=225
PartBody3ShellHp=225

# 2단계(대가리는 맨 마지막에 파괴할 수 있음)
PartHeadHp=525
PartBody1Hp=225
PartBody2Hp=375
PartBody3Hp=375


## 충돌 데미지
BossMeleeDamage0=40
BossMeleeDamage1=40
BossMeleeDamage2=40
BossMeleeDamage3=40
BossMeleeDamage4=40


######################################################################################################################################################





##################################################### 직사 #######################################################################################################
# 시작/메인/끝 모션 설정
JiksaStartAnimation=Jiksa_Ready
JiksaAnimation=Jiksa_Fire,0.7,3000,cycle
JiksaEndAnimation=Jiksa_End,1.5

# 발사 시작 틱
JiksaTickStart=5

# 한번 발사시 총알 갯수
JiksaAngleCount=5

# 발사 반복 횟수
JiksaAttackCount=6

# 반복 발사 간 딜레이 틱
JiksaTickInterval=15

# 탄간 각 거리
JiksaAngleInterval=8

# 최소 각 제한
JiksaMinAngle=50
######################################################################################################################################################



##################################################### 직사2 #######################################################################################################
# 시작/메인/끝 모션 설정
Jiksa2StartAnimation=Jiksa_Ready
Jiksa2Animation=Jiksa_Fire,0.7,2800,cycle
Jiksa2EndAnimation=Jiksa_End

# 발사 시작 틱
Jiksa2TickStart=3

# 한번 발사시 총알 갯수
Jiksa2AngleCount=5

# 발사 반복 횟수
Jiksa2AttackCount=5

# 반복 발사 간 딜레이 틱
Jiksa2TickInterval=15

# 탄간 각 거리
Jiksa2AngleInterval=6

# 최소 각 제한
Jiksa2MinAngle=60
######################################################################################################################################################



##################################################### 파워 웨이브 #######################################################################################################
# 시작/메인/끝 모션 설정 : Idle 모션을 1.0의 속도로 2초간
PowerWaveStartAnimation=Power_Ready,0.5
PowerWaveAnimation=Power_Fire,0.5
PowerWaveEndAnimation=Power_End

# 발사 시작 틱
PowerWaveTickStart=3

# 각 물결간 시간 간격 틱
PowerWaveTickInterval=4

# 각 물결간 거리 간격
PowerWaveDistInterval=60

# 물결 갯수
PowerWaveColumn=12

# 데미지 : 파워 웨이브는 weapon-bossXX-X.ini 에 들어가지 않고 별도 처리
PowerWaveDamage=20

# 바닥 높이
PowerWaveBase=80

# 최소 물결 크기
PowerWaveMinSize=45

# 최대 물결 크기
PowerWaveMaxSize=440

# 물결 단위 높이
PowerWaveUnitHeight=50

# 연달아 맞지 않는 간격
PowerWaveProofTick=10

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간ms, 진폭, 유지시간ms, 방향(0=좌우,1=상하)
PowerWaveHeadShake=5,5,1,100,6,500,0
# PowerWaveMoveShake=10,80,4,100,4,100,1

# 예를 들어
# 물결 갯수 = 5, 최소 = 10, 최대 = 90, 단위 높이 = 30 이면... 각 높이는 10, 50, 90, 50, 10 이 된다
# 각각의 높이는 단위 갯수에 따라 객체가 쌓이니까 = 올림(각높이/단위높이) ... 갯수로는 1, 2, 3, 2, 1 개가 된다.
######################################################################################################################################################





##################################################### 헬 브레스 #######################################################################################################
# 메인 모션 설정
HellBreathAnimation=Breath,0.75

# 발사 시작 틱
HellBreathTickStart=50

# 각 불덩어리 간격 틱 : weapon...ini 화일의 헬 브레스 속도, 이펙의 유지 시간과 밀접한 관계
HellBreathTickInterval=2

# 시각/끝 각도 : 3시=0도, 6시=90도, 9시=180도, 12시=270도
HellBreathAngleStart=60
HellBreathAngleEnd=187

# 각 불덩어리 간 각도
HellBreathAngleInterval=2

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
HellBreathShake=80,180,2,100,4,100,1
######################################################################################################################################################



##################################################### 호밍 #######################################################################################################
# 시작/메인/끝 모션 설정
HomingAnimation=Homing

# 발사 횟수 : 위 아래 번갈아 발사됨
HomingAttackCount=3

# 반복간 대기 틱 : 주의 !) 횟수*틱 이 모션시간 보다 크면 발사되지 않는게 생김
HomingTickInterval=15

# 발사 시작 틱
HomingTickStart=4

# 한번 발사시 총알 갯수
HomingAngleCount=3

# 발사간 각도
HomingAngleInterval=5
######################################################################################################################################################




##################################################### 스카이 락 #######################################################################################################
# 시작/메인/끝 모션 설정
SkyRockStartAnimation=SkyRock_Ready
SkyRockAnimation=SkyRock_Fire
SkyRockEndAnimation=SkyRock_End

# 발사 시작 틱
SkyRockTickStart=33

# 발사 반복 수
SkyRockAttackCount=1

# 반복간 대기 틱
SkyRockTickInterval=5

# 반복간 거리
SkyRockDistInterval=60

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
SkyRockShake=36,36,10,100,8,1500,1
######################################################################################################################################################

##################################################### 핵탄 #######################################################################################################
# 메인 모션 설정
NukeAnimation=Nuke,1.0,3500,cycle

# 시작 틱
NukeTickStart=30

# 발사 반복 수
NukeAttackCount=4

# 반복간 대기 틱
NukeTickInterval=10

# 첫번째 핵탄의 각 : 225 + @
