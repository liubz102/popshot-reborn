# 튀는 용암 랜덤 각 차이 : 60 ~ 30
ChangeFireRandomRange=15

# 지진 효과 = 시작틱, 끝틱, 반복틱, 주기시간, 진폭, 유지시간,방향(0=좌우,1=상하)
#ChangeOutShake=24,24,1,200,24,300,1
#ChangeInShake=24,24,1,200,24,300,1
