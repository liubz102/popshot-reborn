# 2개간 최대 랜덤 각 차이 : 15 ~ 7.5
NukeRandomRange=15

######################################################################################################################################################


##################################################### 위치 바꿈 #######################################################################################################
# 시작/메인/끝 모션 설정
ChangeStartAnimation=Change_Out,2.5
#,1.8,3333
ChangeAnimation=Idle,1.0,100
ChangeEndAnimation=Change_In

# 나가는 시간 틱 = 들어오는 시간 틱
ChangeTick=100
# 한 틱 당 움직이는 거리
ChangeDistInterval=10

# 튀는 용암의 시작 시각
ChangeFireTickStart=10
# 튀는 용암의 갯수
ChangeFireCount=10
# 튀는 용암 간격 대기 틱
