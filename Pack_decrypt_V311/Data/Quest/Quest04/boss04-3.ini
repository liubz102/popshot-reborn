
## 범용주석
# 본 ini파일은 각 공격의 패턴을 설정하는데 필요한 정보를 담고 있음.
# HP, 모션의 길이, 시간개념, 탄환수, 발사횟수등 "대미지"를 제외한 나머지 요소를 다룸.
# 대미지 관련 정보는 Weapon-boss01-x.ini 파일에서 다룸.


# 거리 = 픽셀(pixel)
# 틱 = 1/33 초

################################################## 크기 및 HP설정 ###########################################################################
[General]
## 몸통 크기 비율
SizeRatio=1.3
# 주의 : x방향90%, y방향90% 라면 면적은 81% 가 된다
# 면적대비 90% 라면 0.94 정도로 입력해야

Phase0PosY=285
Phase1Down=50
Phase2Down=35

# 1단계
PartDAHp=180
PartDBHp=180
PartEAHp=140
PartEBHp=140
PartGAHp=1

# 2단계
PartHAHp=210
PartHBHp=210
PartHCHp=210
PartIAHp=180
PartIBHp=180

# 3단계
PartJAHp=120
PartJBHp=120
PartJCHp=120
PartKAHp=240
PartKBHp=240





# 충돌 데미지
MeleeDamage=30

# 흔들림효과 = 주기시간(틱), 진폭(도트)
Shake=100,10
######################################################################################################################################################



##################################################### Phase #############################################################################
[Phase]
# 시간 설정
Phase1Animation=Idle
Phase2Animation=Idle
Tick=30

# Phase 바뀔때의 흔들림
Shake=10,6
######################################################################################################################################################



##################################################### 휴식 #####################################################

########################
[Idle]
# 시간 설정
Idle1Animation=Idle, 0.5
Idle2Animation=Idle

######################################################################################################################################################



##################################################### 사망 #############################################################################
[Death]
Animation=Idle,0.1

# 이동 시간 틱
Tick=250

# 전체 이동 거리
Move=2000

# 연출 간격 틱
EffectInterval=16

# 흔들림효과 = 주기시간(틱), 진폭(도트)
Shake=10,10
########################################################################################################################################



##################################################### 출현 #############################################################################
[Birth]
# JA,JB,JC
Animation=Idle,0.3, 8000

# 이동 시간 틱
Tick=200

# 전체 이동 거리
Move=2000

########################################################################################################################################



################################################### 사이드 건 BA,BB,BC #######################################################################################
[SideGun]
# 시작/메인/끝 모션 설정
StartAnimation=B_Open
FireAnimation=B_Fire,1.0,3000,cycle
EndAnimation=B_Close,2.0

# 총알 기준/범위 각도 : 90도(6시방향)를 기준으로, 좌우30도씩 펼치고, 좌우 20도의 랜덤으로
BulletAngle=90
BulletSpread=30
BulletRange=40

# 쏘기 시작하는 틱
TickStart=1

# 발사간 시간 틱
TickInterval=1
#####################################################################################################################################################



################################################### 사이드 핵 CA, CB ################################################################################
[SideNuke]
# 시작/메인/끝 모션 설정
StartAnimation=C_Open
FireAnimation=%s_Fire, 1.5, 3000, cycle
EndAnimation=C_Close

# 발사 유형
FireType=Target

# 한번당 발사 총알수
