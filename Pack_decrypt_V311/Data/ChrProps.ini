# DisplayHeight : HP/SP 바를 보여주기 위한 키 높이 
# ChrLowerScale: 하체비율
# ChrUpperScale: 상체비율
# ChrSpineScale: 허리길이
# ChrSizeBody: 몸통 충돌체크사이즈
# ChrSizeHead: 머리 충돌체크사이즈
# ChrSpeed: 캐릭터 속도
# DashTotalTick: 대시시 총 걸리는 시간
# DashReadyTick: 대시시 준비하는 시간
# DashDamageTick: 대시시 준비후 대미지 입히는 시간
# DashMoveTick: 대시후 이동하는 시간
# DashMove: 이동시 이동력 (이동 거리가 아님!)
# ChrSizeLegs 는 다리 충돌체크사이즈
# ChrSizeLegsCrouch 는 움추렸을때/앉기 했을때 의 작아진 다리충돌원 사이즈

# Dashxx-DontPush 가 0이거나 없으면 Cast동안 Push를 하고 1이면 Push없이 이동만

# ex) dash 00을 샘플로.
# Dash00-PosDeltaInitX=20	//스태틱 데미지가 처음에 시작하는 위치. x값
# Dash00-PosDeltaInitY=-50	//스태틱 데미지가 처음에 시작하는 위치. y값
# Dash00-StartDegree=270	//삼각함수의 시작시점. 각 프레임에 따라서 코사인, 사인값의 변화로 x,y값을 결정한다
# Dash00-MaxDegree=180		//프레임이 끝날때까지 얼마나 움직이는지 결정
# Dash00-MultiForX=50		//얻어진 코사인, 사인값을 얼마나 증가시켜 사용할지를 결정
# Dash00-MultiForY=10		//얻어진 코사인, 사인값을 얼마나 증가시켜 사용할지를 결정
# Dash00-DamageSize=30		//데미지 사이즈
# Dash00-TickAdd=1		//CurrTick에 + 해 주어서 계산한다. 프로코만 1로 사용.없으면 디폴트 0
# 계산식
# posDelta는 케릭터 중점으로 부터 얼마만큼 스태틱 데미지가 떨어져있는지 기본 시작점을 말한다.
# D3DXVECTOR2 posDelta(posDeltaInitX, posDeltaInitY);
# currTick는 현재 프레임
# 각도는 시작 각도 + (현재 프레임*최대 이동 각도 /전체프레임)로 결정된다
# degree = startDegree + currTick * maxDegree / (damageEndFrame - 1);
# 스태틱 데미지의 초기값에다 코사인, 사인값을 구하고 그 값에 적절한 곱을 하여 x,y의 값을 결정한다
# posDelta.x += cosf(D3DXToRadian(degree)) * multiForX;
# posDelta.y += sinf(D3DXToRadian(degree)) * multiForY;

# Character 공격, 방어 수치. 케릭터 스테이터스 바를 보여줄때 사용한다.실제 데미지계산등에 무관하다.
# ChrAttack=6
# ChrDefense=6


