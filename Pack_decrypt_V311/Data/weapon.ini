# Weapon.ini 기본 설명

# 이미지 설정 관련 #
# Size			데미지 사이즈
# DispSize		화면 표시시에 확대/축소 적용되는 비례값
# PowerControl	힘 조절 기능이 들어가는 무기인지의 여부. 0 = 비활성(아니다), 1 = 활성(맞다)
# WAnimIdx		화면에 찍히는 조준점의 종류 설정(0 ~ 4 까지 있을꺼야 -_-)

# 탄환의 운동 관련 #
# Velocity		탄환의 이동속도. Gravity Factor와 함께 탄환의 운동을 정의하는 값.
# GravityFactor	중력값(1이면 디폴트, 1 이하(소수점)나 이상으로 설정 가능함. 
#               저격무기의 경우, 200 이상의 높은 값을 설정함.

# 데미지 설정 관련 #
# Damage		상대방에게 가해지는 데미지값
# HeadDamage	헤드샷일 경우의 데미지값
# LegsDamage	다리에 맞았을 때의 데미지값
# SplashDamage	스플래쉬 데미지값
# SplashRange	스플래쉬 데미지가 가해지는 영역.
#               터지는 지점이 중점이 되어 일정 반경(단위:픽셀)에 영향을 줌.]
#               중점에서 멀어질수록 스플래쉬 데미지값이 작아짐.

# 시간 벨런스 관련 #
# LoadingTime	무기교체타임
# CoolingTime	총알 한발을 쏘고 나서 다음 총알을 쏘는데 걸리는 시간
# MagazineCount	탄환의 숫자
# ReloadTime	한 탄창을 다 쓰고 났을때 다시 탄환이 충전되는 시간

# 특수 조건 설정 관련#
# Hp			무기에 HP를 세팅하는 경우는, 총알에 체력(HP)을 부여해서, 
#		        적이 내 총알을 공격했을 때 터지게 만들어줌.
# ExplodeTime	발사된 총알이 몇초(단위:ms)뒤에 파괴 되는지 지정함.
# CreatingClass 해당 무기에서 발사되는 탄환의 속성을 정해줌.
# 				BounceBullet = 탄환이 벽에 부딪혔을 때 튕겨남.
# Healing		데미지를 주는 총알이 아닌, 힐링을 해주는 경우 1
# BounceCount	튕기는 속성(BounceBullet)일 경우, 튕김 횟수

# 이펙트 관련 #
# EffCommon		터질때 공통으로 나오는 이펙트
# EffHitObj		오브젝트를 맞췄을 때 타격점에 나오는 이펙트
# EffStatic		땅바닥에 맞게 됐을 때 땅 타격점에 나오는 이펙트
# EffObject		오브젝트를 맞췄을 때 오브젝트에 붙게되는 이펙트
# EffCharge		힘 모으기 이펙트
# EffMesh		총알 메쉬에 붙이는 이펙트
# EffTail		꼬리 이펙트
# EffBounce		튕길때 땅에 붙는 이펙트
# LineTexture	꼬리 이미지
# LineWidthRatio 꼬리 이미지 표시 확대/축소 비율

# WMeshIdx가 정의되지 않으면 WAnimIdx의 값을 사용..-1은 무기를 들지 않음
# LinePointPopTime : 0 이면 꼬리 안나옴

# 전연령 관련 #
# 각 항목 앞에 _ 가 붙으면 전연령용 세팅

###############################################################################
