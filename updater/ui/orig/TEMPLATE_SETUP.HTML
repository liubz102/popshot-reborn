<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
 <meta http-equiv="Content-Type" content="text/html; charset=gb2312">
	<title>Nexon Game Manager</title>
	<link rel="stylesheet" type="text/css" href="global.css">
	<script language="javascript">
	function SetInstallPath( type )
	{
		if ( type == 0 )
		{
			document.all.InstallPathPrefix.style.display = "none";
			document.all.InstallPath.style.display = "none";
		}
		else if ( type == 1 )
		{
			document.all.InstallPathPrefix.style.display = "";
			document.all.InstallPath.style.display = "";
		}
		else if ( type == 2 )
		{
			document.all.InstallPathPrefix.style.display = "";
			document.all.InstallPath.style.display = "";
		}
	}

	function HideOptionTitle()
	{
		document.all.OptionTitle.style.display="none";
	}

	function SetStartPage( type )
	{
		if ( type == 0 )
		{
			document.all.StartPage.style.display = "none";
		}
		else if ( type == 1 )
		{
			document.all.StartPage.style.display = "";
		}
		else if ( type == 2 )
		{
			document.all.StartPage.style.display = "";
		}
	}
	function SetNexonPlug( type )
	{
		if ( type == 0 )
		{
			document.all.NexonPlug.style.display = "none";
		}
		else if ( type == 1 || type == 2 )
		{
			document.all.NexonPlug.style.display = "";
		}
	}
	function SetNaverToolbarType( type )
	{
		if ( type == 0 )
		{
			document.all.NaverToolbar.style.display = "none";
		}
		else if ( type == 1 || type == 2 )
		{
			document.all.NaverToolbar.style.display = "";
		}
	}
	</script>
</head>

<body oncontextmenu="return false;" onselectstart="return false;" ondragover="return false;" ondrag="return false;">

<!--490/283-->
<div style="width:490px;" id="Container">
	<div><img src="BINARY/round1_top2.gif" width="490" height="5" /></div> 
	<table cellpadding="0" cellspacing="0" class="Wrapper">
	<tr><td>
			<div id="TopSec">
				<h1 class="TopLogo"><img id="TopLogo" src="BINARY/tiancity_logo.gif" width="87" height="26" alt="世纪天成" /></h1>
				<a href="#"><img id="btnClose" src="BINARY/bt_close.gif" width="17" height="16" alt="关闭" class="BtClose" /></a>		
			</div>
			<div id="CntsSec">
				<div><img src="BINARY/round2_top2.gif" width="478" height="4" /></div> 
				<div id="Cnts1Wrap">				
					<div><img src="BINARY/round3_top2.gif" width="466" height="2" /></div>
					<div id="Cnts2Wrap" style="height:190px;">
						<h4 id="InstallPathPrefix" style="display:" class="OptionTit">设置安装文档</h4>					
						<div id="InstallPath" style="display:"  class="OptionFolder">
							安装文档&nbsp;
							<input id="EditDesination" type="text" disabled/>
							<a href="#" name="" id=""><img id="btnFind" src="BINARY/bt_change_folder.gif" width="69" height="18" alt="变更文档" /></a>
						</div>
						<h4 id="OptionTitle" class="OptionTit" style="display:">增加安装或选择设置</h4>
						<ul class="OptionList">
							<li id="StartPage" style="display:none"><input id="CheckStartPage" type="checkbox" />将世纪天成指定为初始页</li>
							<li id="NexonPlug" style="display:none"><input id="CheckNexonPlug" type="checkbox" />&nbsp;</li>
							<li id="NaverToolbar"  style="display:none"><input id="CheckNaverToolbar" type="checkbox" />&nbsp;</li>
						</ul>
					</div>
					<div><img src="BINARY/round3_btm2.gif" width="466" height="2" /></div>
					<div id="BtmSec">
						<a href="#"><img id="btnOK" src="BINARY/bt_install.gif" width="55" height="18" alt="安装" /></a>
						<a href="#"><img id="btnCancel" src="BINARY/bt_cancel.gif" width="55" height="18"alt="取消" /></a>	
					</div>
				</div>
				<div><img src="BINARY/round2_btm2.gif" width="478" height="4" /></div> 				
			</div>
		</td></tr>
	</table>		          
	<div><img src="BINARY/round1_btm2.gif" width="490" height="5" /></div> 
</div>
                          
</body>
</html>
